[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "impactgraph"
version = "0.3.0"
description = "AI-powered Change Impact Graph for data and code systems: answer 'if I change this, what can break?'"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Arati" }]
keywords = [
    "change-impact",
    "lineage",
    "dbt",
    "sql",
    "openlineage",
    "dependency-graph",
    "data-engineering",
    "impact-analysis",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Database",
]
dependencies = [
    "networkx>=3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
sql = ["sqlglot>=20.0"]
ai = ["anthropic>=0.40.0"]
mcp = ["mcp>=1.0; python_version >= '3.10'"]
yaml = ["pyyaml>=6.0"]
all = ["sqlglot>=20.0", "anthropic>=0.40.0", "mcp>=1.0; python_version >= '3.10'", "pyyaml>=6.0"]
dev = ["pytest>=7.0", "sqlglot>=20.0", "pyyaml>=6.0"]

[project.scripts]
impactgraph = "impactgraph.cli:main"

[project.urls]
Homepage = "https://github.com/sumit-gupta03/impactgraph"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
