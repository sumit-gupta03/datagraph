# Copy to .github/workflows/impact.yml in a repo that uses impactgraph.
name: change impact
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Build your dbt manifest first if you want data lineage, e.g.:
      # - run: pip install dbt-core dbt-snowflake && dbt compile
      - uses: sumit-gupta03/impactgraph@main
        with:
          repo-path: src
          dbt-manifest: target/manifest.json
          fail-on: CRITICAL
